name: Publish to WinGet

on:
  release:
    types: [ released ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Sync winget-pkgs fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh api \
            --method POST \
            /repos/icyhoty2k/winget-pkgs/merge-upstream \
            -f branch=master

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: IcyHotY2K.QuickImageViewer
          token: ${{ secrets.WINGET_TOKEN }}
          # Uncomment if you publish multiple assets and want only the .exe picked up:
          # installers-regex: '\.exe$'
