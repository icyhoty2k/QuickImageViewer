name: Publish to WinGet

on:
  release:
    types: [ released ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: IcyHotY2K.QuickImageViewer
          token: ${{ secrets.WINGET_TOKEN }}
          release-notes-url: ${{ github.event.release.html_url }}
          installers-regex: '\.exe$'

      - name: Add ReleaseNotes to WinGet PR
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Finding WinGet PR for ${RELEASE_TAG}..."

          PR_JSON=$(gh pr list \
            --repo microsoft/winget-pkgs \
            --state open \
            --author icyhoty2k \
            --search "IcyHotY2K.QuickImageViewer ${RELEASE_TAG}" \
            --json number,head,title \
            --limit 20)

          PR_COUNT=$(echo "$PR_JSON" | jq 'length')

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "::error::Could not find the WinGet PR for ${RELEASE_TAG}"
            exit 1
          fi

          if [ "$PR_COUNT" -gt 1 ]; then
            echo "::error::Found multiple possible WinGet PRs:"
            echo "$PR_JSON" | jq .
            exit 1
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number')
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.[0].head.ref')

          echo "WinGet PR: #${PR_NUMBER}"
          echo "Head branch: ${HEAD_REF}"

          echo "Downloading release information..."

          RELEASE_JSON=$(gh api \
            "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}")

          RELEASE_BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')

          if [ -z "$RELEASE_BODY" ]; then
            echo "::warning::GitHub Release has no release notes."
            exit 0
          fi

          echo "Cloning winget-pkgs fork..."

          git clone \
            --branch "$HEAD_REF" \
            --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/icyhoty2k/winget-pkgs.git" \
            winget-pkgs

          cd winget-pkgs

          MANIFEST_DIR="manifests/i/IcyHotY2K/QuickImageViewer/${RELEASE_TAG#v}"

          LOCALE_MANIFEST="${MANIFEST_DIR}/IcyHotY2K.QuickImageViewer.locale.en-US.yaml"

          if [ ! -f "$LOCALE_MANIFEST" ]; then
            echo "::error::Manifest not found: $LOCALE_MANIFEST"
            exit 1
          fi

          echo "Updating $LOCALE_MANIFEST..."

          python3 - "$LOCALE_MANIFEST" "$RELEASE_BODY" <<'PY'
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          release_notes = sys.argv[2]

          text = manifest_path.read_text(encoding="utf-8")

          # Remove an existing ReleaseNotes block if one exists.
          lines = text.splitlines()
          output = []
          i = 0

          while i < len(lines):
              if lines[i].startswith("ReleaseNotes:"):
                  i += 1

                  # Skip the indented folded-scalar content.
                  while i < len(lines):
                      if lines[i].startswith(" ") or lines[i].strip() == "":
                          i += 1
                      else:
                          break
                  continue

              output.append(lines[i])
              i += 1

          text = "\n".join(output).rstrip() + "\n"

          # Insert ReleaseNotes immediately before ReleaseNotesUrl.
          note_lines = release_notes.splitlines()

          formatted = ["ReleaseNotes: >-"]

          if note_lines:
              for line in note_lines:
                  if line:
                      formatted.append(f"  {line}")
                  else:
                      formatted.append("")

          release_notes_block = "\n".join(formatted)

          marker = "ReleaseNotesUrl:"

          if marker not in text:
              raise SystemExit(
                  "ReleaseNotesUrl was not found in the manifest"
              )

          text = text.replace(
              marker,
              release_notes_block + "\n" + marker,
              1,
          )

          manifest_path.write_text(text, encoding="utf-8")
          PY

          echo "Resulting ReleaseNotes:"
          grep -A 20 '^ReleaseNotes:' "$LOCALE_MANIFEST" || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$LOCALE_MANIFEST"

          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git commit \
            -m "Add ReleaseNotes for QuickImageViewer ${RELEASE_TAG#v}"

          git push origin "$HEAD_REF"

          echo "Updated WinGet PR #${PR_NUMBER} successfully."
