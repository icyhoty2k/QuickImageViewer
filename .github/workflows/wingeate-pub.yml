name: Publish to WinGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag"
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Verify release asset
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/QuickImageViewer.exe"

          Write-Host "Checking:"
          Write-Host $url

          try {
            Invoke-WebRequest `
              -Uri $url `
              -Method Head `
              -MaximumRedirection 10 `
              -ErrorAction Stop

            Write-Host "QuickImageViewer.exe found."
          }
          catch {
            throw "QuickImageViewer.exe was not found at $url"
          }

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/wingetcreate/latest" `
            -OutFile "$env:RUNNER_TEMP\wingetcreate.exe"

      - name: Publish to WinGet
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/QuickImageViewer.exe"

          Write-Host "Publishing:"
          Write-Host "Tag: $env:TAG"
          Write-Host "URL: $url"

          & "$env:RUNNER_TEMP\wingetcreate.exe" update `
            IcyHotY2K.QuickImageViewer `
            --urls "$url" `
            --submit `
            --token "$env:WINGET_TOKEN"
