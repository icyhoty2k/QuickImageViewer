name: Publish to WinGet112

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag to publish"
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Get release information
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:TAG" | ConvertFrom-Json

          if (-not $release) {
            throw "GitHub Release '$env:TAG' was not found."
          }

          $asset = $release.assets | Where-Object { $_.name -eq "QuickImageViewer.exe" }

          if (-not $asset) {
            throw "QuickImageViewer.exe was not found in release '$env:TAG'."
          }

          $version = $env:TAG.TrimStart("v")

          Write-Host "Release tag: $env:TAG"
          Write-Host "WinGet version: $version"
          Write-Host "Asset: $($asset.name)"
          Write-Host "Download URL: $($asset.browser_download_url)"

          "tag=$env:TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/wingetcreate/latest" `
            -OutFile "$env:RUNNER_TEMP\wingetcreate.exe"

      - name: Publish to WinGet
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $url = "${{ steps.release.outputs.url }}"

          Write-Host "Publishing version: $version"
          Write-Host "Installer URL: $url"

          & "$env:RUNNER_TEMP\wingetcreate.exe" update `
            IcyHotY2K.QuickImageViewer `
            --urls "$url" `
            --submit `
            --token "$env:WINGET_TOKEN"
