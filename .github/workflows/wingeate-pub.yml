name: Publish to WinGet2341

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag"
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Get release asset
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $repo = "${{ github.repository }}"

          $releaseUrl = "https://api.github.com/repos/$repo/releases/tags/$env:TAG"

          Write-Host "Getting release:"
          Write-Host $releaseUrl

          $release = Invoke-RestMethod `
            -Uri $releaseUrl `
            -Headers $headers `
            -Method Get

          $asset = $release.assets |
            Where-Object { $_.name -eq "QuickImageViewer.exe" }

          if (-not $asset) {
            throw "QuickImageViewer.exe was not found in release '$env:TAG'."
          }

          Write-Host "Release: $($release.name)"
          Write-Host "Tag: $($release.tag_name)"
          Write-Host "Asset: $($asset.name)"
          Write-Host "Asset ID: $($asset.id)"
          Write-Host "Asset size: $($asset.size)"

          "url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/wingetcreate/latest" `
            -OutFile "$env:RUNNER_TEMP\wingetcreate.exe"

      - name: Publish to WinGet
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          $version = $env:TAG -replace '^[Vv]', ''
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/QuickImageViewer.exe"

          Write-Host "Publishing QIV:"
          Write-Host "GitHub tag: $env:TAG"
          Write-Host "WinGet version: $version"
          Write-Host "Installer URL: $url"

          & "$env:RUNNER_TEMP\wingetcreate.exe" update `
            IcyHotY2K.QuickImageViewer `
            --version $version `
            --urls "$url" `
            --submit `
            --token "$env:WINGET_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate failed with exit code $LASTEXITCODE"
          }
