name: Publish to WinGet5

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag"
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Find existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $release = gh api `
            "repos/${{ github.repository }}/releases/tags/$env:TAG" |
            ConvertFrom-Json

          if (-not $release) {
            throw "Release '$env:TAG' does not exist."
          }

          $asset = $release.assets |
            Where-Object { $_.name -eq "QuickImageViewer.exe" }

          if (-not $asset) {
            throw "QuickImageViewer.exe is missing from release '$env:TAG'."
          }

          Write-Host "Release: $($release.name)"
          Write-Host "Tag: $($release.tag_name)"
          Write-Host "Asset: $($asset.name)"
          Write-Host "URL: $($asset.browser_download_url)"

          "url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/wingetcreate/latest" `
            -OutFile "$env:RUNNER_TEMP\wingetcreate.exe"

      - name: Publish to WinGet
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          & "$env:RUNNER_TEMP\wingetcreate.exe" update `
            IcyHotY2K.QuickImageViewer `
            --urls "${{ steps.release.outputs.url }}" `
            --submit `
            --token "$env:WINGET_TOKEN"
