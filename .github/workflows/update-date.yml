name: Update dateModified

on:
  push:
    branches: [main]
  # A new release starts the "latest release" download count again at zero,
  # and release.yml's own metadata commit is pushed with GITHUB_TOKEN, which
  # never triggers another workflow — so without this the badge kept showing
  # the previous release's count until the next manual push.
  release:
    types: [published]
  # Downloads happen without any push: after v3.2.0.452 nothing reached main
  # for weeks, so both download badges stayed frozen (latest release at 0
  # while it had 748). The daily run refreshes only the badge data — it does
  # not stamp dateModified, and commits only when a number actually moved.
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

jobs:
  update-date:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # main, not the event's ref: a release event checks out the TAG,
          # detached, and the commit below could not be pushed from there.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp today's date into docs/index.html
        # Not on the schedule: the page did not change, only the counters did.
        if: github.event_name != 'schedule'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s/\"dateModified\": \"[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\"/\"dateModified\": \"$TODAY\"/" docs/index.html
          echo "dateModified → $TODAY"

      # README badge data. The live shields.io GitHub badges (downloads, last
      # commit) go "invalid" whenever shields' shared GitHub API quota runs dry,
      # and GitHub's image proxy then caches the error. These files are read by
      # shields' /endpoint badge instead, so the numbers come from THIS run's
      # token and the date from the commit just pushed. An unreachable API
      # keeps the previous files rather than writing a broken badge.
      - name: Write README badge data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p docs/badges
          # First: the download block below may stop early (exit 0) to keep the
          # previous counts, and must not take this badge with it.
          jq -n --arg d "$(git log -1 --format=%cs)" \
            '{schemaVersion:1, label:"last commit", message:$d, color:"d29922"}' \
            > docs/badges/last-commit.json

          human='def h: if . >= 1000000 then "\((./100000|floor)/10)M" elif . >= 1000 then "\((./100|floor)/10)k" else tostring end;'

          if rel=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"); then
            total=$(jq '[.[].assets[]?.download_count] | add // 0' <<<"$rel")
            latest=$(jq '[.[] | select((.prerelease or .draft) | not)][0] // {} | [.assets[]?.download_count] | add // 0' <<<"$rel")
            tag=$(jq -r '[.[] | select((.prerelease or .draft) | not)][0].tag_name // ""' <<<"$rel")

            # What users download, not GitHub's "code size" (bytes of source in
            # the repo, which said 5.4 MiB while the EXE was 9.8). Written before
            # SourceForge is asked, so an outage there cannot hold it back.
            exe=$(jq '[.[] | select((.prerelease or .draft) | not)][0].assets // [] | map(select(.name == "QuickImageViewer.exe"))[0].size // 0' <<<"$rel")
            if [ "$exe" -gt 0 ]; then
              jq -n --argjson b "$exe" \
                '{schemaVersion:1, label:"exe size", message:("\((($b/1048576)*10|round)/10) MiB"), color:"8957e5"}' \
                > docs/badges/exe-size.json
            else
              echo "::warning::QuickImageViewer.exe missing from $tag - keeping the previous size badge."
            fi

            # SourceForge mirror (sourceforge-publish.yml uploads every release
            # into a folder named after its tag). Winget needs nothing extra: its
            # manifest points at the GitHub asset, so those are counted above.
            # Public stats API, no key. If SourceForge is down, keep the previous
            # badges rather than publish a total that suddenly drops.
            sf="https://sourceforge.net/projects/quickimageviewer/files"
            range="start_date=2020-01-01&end_date=$(date -u +%Y-%m-%d)"
            if ! sf_total=$(curl -fsSL --max-time 30 "$sf/stats/json?$range" | jq -e '.total'); then
              echo "::warning::SourceForge stats unreachable - keeping the previous download badges."
              exit 0
            fi
            # The newest tag's folder 404s until its SourceForge upload finishes:
            # that is a real 0, any other failure is not.
            code=$(curl -sSL --max-time 30 -o sf_latest.json -w '%{http_code}' "$sf/$tag/stats/json?$range" || echo 000)
            if [ "$code" = 200 ]; then
              sf_latest=$(jq -e '.total' sf_latest.json)
            elif [ "$code" = 404 ]; then
              sf_latest=0
            else
              echo "::warning::SourceForge stats for $tag returned $code - keeping the previous download badges."
              rm -f sf_latest.json
              exit 0
            fi
            rm -f sf_latest.json
            echo "GitHub: downloads $total, latest $latest; SourceForge: downloads $sf_total, $tag $sf_latest"
            total=$((total + sf_total))
            latest=$((latest + sf_latest))

            jq -n --argjson n "$total" "$human"'{schemaVersion:1, label:"downloads", message:($n|h), color:"1f6feb"}' \
              > docs/badges/downloads.json
            # The label names the version: a bare "latest release | 762" reads as
            # if 762 were the version, not the download count.
            jq -n --argjson n "$latest" --arg t "$tag" "$human"'{schemaVersion:1, label:"\($t) downloads", message:($n|h), color:"1f6feb"}' \
              > docs/badges/downloads-latest.json
            echo "downloads $total, latest release $latest"
          else
            echo "::warning::GitHub API unreachable - keeping the previous download badges."
          fi

      - name: Commit if changed
        run: |
          # Repository owner, not github-actions[bot] — a bot author shows up in
          # the Contributors sidebar. See the same note in release.yml.
          git config user.name "icyhoty2k"
          git config user.email "icyhoty2k@gmail.com"
          git add docs/index.html docs/badges
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: update dateModified and README badges [skip ci]"
          # refresh-stats.yml and release.yml push to main too, and on a release
          # this job starts in the SAME second as release.yml — its metadata
          # commit landed between our pull and our push on the first release
          # run. Rebase and retry instead of failing; they touch other files.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt) - main moved; retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

      - name: Notify IndexNow
        if: github.event_name != 'schedule'
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "icyhoty2k.github.io",
              "key": "f2bb14e6011a4b8cb9243d4feb59f985",
              "keyLocation": "https://icyhoty2k.github.io/QuickImageViewer/f2bb14e6011a4b8cb9243d4feb59f985.txt",
              "urlList": [
                "https://icyhoty2k.github.io/QuickImageViewer/",
                "https://icyhoty2k.github.io/QuickImageViewer/index.html"
              ]
            }'
