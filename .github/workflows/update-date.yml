name: Update dateModified

on:
  push:
    branches: [main]

jobs:
  update-date:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp today's date into docs/index.html
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s/\"dateModified\": \"[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\"/\"dateModified\": \"$TODAY\"/" docs/index.html
          echo "dateModified → $TODAY"

      - name: Commit if changed
        run: |
          # Repository owner, not github-actions[bot] — a bot author shows up in
          # the Contributors sidebar. See the same note in release.yml.
          git config user.name "icyhoty2k"
          git config user.email "icyhoty2k@gmail.com"
          git diff --quiet docs/index.html || git commit -am "chore: update dateModified to $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Notify IndexNow
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "icyhoty2k.github.io",
              "key": "f2bb14e6011a4b8cb9243d4feb59f985",
              "keyLocation": "https://icyhoty2k.github.io/QuickImageViewer/f2bb14e6011a4b8cb9243d4feb59f985.txt",
              "urlList": [
                "https://icyhoty2k.github.io/QuickImageViewer/",
                "https://icyhoty2k.github.io/QuickImageViewer/index.html"
              ]
            }'
