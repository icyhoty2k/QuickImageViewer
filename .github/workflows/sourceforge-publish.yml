# MANUAL BACKUP ONLY.
#
# Normal path: SourceForge's own "GitHub Releases Integration" webhook mirrors
# every release automatically (project admin -> Files -> GitHub Integration).
# This workflow exists for when that integration is broken, disabled, or a
# release needs re-pushing by hand. It never runs on its own.
#
# Requires repo secrets:
#   SF_SSH_PRIVATE_KEY  - private key whose public half is on the SourceForge account
#   SF_API_KEY          - optional; only used to flip the default-download flags
name: Publish to SourceForge (manual backup)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror (e.g. v1.2.3). Blank = latest release.'
        required: false
        default: ''
      set_default:
        description: 'Also mark it as the default download (needs SF_API_KEY)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  SF_PROJECT: quickimageviewer
  SF_USER: icyhoty2k
  ASSET_NAME: QuickImageViewer.exe

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "Mirroring tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upload
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir upload
          ls -l upload

      - name: Build release notes file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # SourceForge renders README.md of a release folder as its notes.
          gh release view "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json body -q .body > upload/README.md

      - name: Setup SSH key
        env:
          SF_SSH_PRIVATE_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SF_SSH_PRIVATE_KEY" ]; then
            echo "::error::SF_SSH_PRIVATE_KEY secret is not set - cannot upload."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SF_SSH_PRIVATE_KEY" > ~/.ssh/id_sf
          chmod 600 ~/.ssh/id_sf
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to SourceForge File Release System
        run: |
          set -euo pipefail
          DEST="/home/frs/project/${SF_PROJECT}/${{ steps.tag.outputs.tag }}/"
          rsync -avP -e "ssh -i ~/.ssh/id_sf -o StrictHostKeyChecking=yes" \
            upload/ "${SF_USER}@frs.sourceforge.net:${DEST}"

      - name: Set as default download for all platforms
        env:
          SF_API_KEY: ${{ secrets.SF_API_KEY }}
        if: ${{ inputs.set_default && env.SF_API_KEY != '' }}
        run: |
          set -euo pipefail
          curl -sS -H "Accept: application/json" -X PUT \
            -d "api_key=${SF_API_KEY}" \
            -d "default=windows" \
            -d "default=mac" \
            -d "default=linux" \
            -d "default=bsd" \
            -d "default=solaris" \
            -d "default=others" \
            "https://sourceforge.net/projects/${SF_PROJECT}/files/${{ steps.tag.outputs.tag }}/${ASSET_NAME}" \
            | head -c 500
