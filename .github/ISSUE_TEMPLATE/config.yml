# Blank issues stay ENABLED on purpose. A form is a help, not a gate — someone
# with a report that fits none of the three above should still be able to write
# it down rather than abandoning it.
blank_issues_enabled: true

contact_links:
  - name: Read the manual first (it is thorough)
    url: https://icyhoty2k.github.io/QuickImageViewer/
    about: >
      Every shortcut, panel, command-line flag and the remote protocol. The same
      reference is inside the app — press F1.

  - name: Security issue — please do not open a public issue
    url: https://github.com/icyhoty2k/QuickImageViewer/security/advisories/new
    about: >
      qIV can listen on a network port, so a flaw in authentication, TLS, or the
      AllowList deserves a private report first. Use this, or email
      icyhoty2k@gmail.com.

  - name: Commercial licensing
    url: mailto:icyhoty2k@gmail.com
    about: >
      Building qIV or its remote subsystem into a product you do not intend to
      open-source — signage, kiosks, retail, industrial or medical displays.
