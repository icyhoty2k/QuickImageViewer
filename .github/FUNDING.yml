# Puts the "Sponsor" button in the repository header.
#
# GitHub Sponsors profile verified live at https://github.com/sponsors/icyhoty2k
# before this line was enabled. An entry pointing at an account that has not
# finished enrolling shows visitors a "not accepting sponsorships" page, which is
# worse than having no button at all — so check the profile loads before adding a
# platform here.
#
# This funds the DESKTOP viewer and this repository. It has nothing to do with the
# Android app: anything bought for use inside that app must be bought through
# Google Play Billing and nowhere else.

github: icyhoty2k
ko_fi: ivanhristovyanev

# Ko-fi is listed alongside rather than instead of Sponsors: it reaches people who
# have no GitHub account, which is nearly everyone who is not a developer. GitHub
# shows both in the Sponsor dropdown.
#
# NOTE the two are not equivalent underneath. GitHub covers the payment processing
# fees on Sponsors, so that route delivers close to the full amount; Ko-fi payments
# are ordinary transactions through PayPal or Stripe and carry their fees.

