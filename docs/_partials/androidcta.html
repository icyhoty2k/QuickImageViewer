<!-- The hero's Android call to action.

     WHY THIS IS A PARTIAL RATHER THAN PLAIN HTML IN index.html. The weekly
     statistics workflow commits to docs/index.html, so every hand edit to that
     file collides with a bot commit, and resolving the conflict in favour of
     origin reverts the hand edit without reporting anything. It happened on
     12 August 2026 and cost three separate changes. Content that lives here
     cannot be lost that way: the bot never touches _partials/, and an
     index.html restored from origin is repaired by re-running build-site.py.

     It is NOT the same block as the Android column in storerow.html, and it is
     deliberately not shared with it. index.html's hero is a "storerow stacked"
     variant whose desktop column carries the SHARED-VERSION fence, and its
     formatting differs. A fence cannot be filled from inside another partial in
     one pass anyway — inject_partials walks docs/*.html only. Both copies are
     flipped together by the maintainer's site-mode script, kept outside this
     repository, which fails if they ever disagree.

     THIS BUTTON'S TARGET IS MODE-DEPENDENT AND IS NOT HAND-MAINTAINED. While the
     app is in closed testing it points at the tester group, because the store URL
     returns "item not found" to anyone who is not enrolled. Ten surfaces on this
     site carry that same state and a half-done flip is invisible, so one script
     owns all of them. -->
